[project]
name = "grpman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=4.18.0",
    "hydrogram>=0.2.0",
    "pydantic-settings>=2.14.1",
    "telethon>=1.43.2",
    "tgcrypto>=1.2.5",
    "tomli-w>=1.2.0",
    "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.7",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 80
